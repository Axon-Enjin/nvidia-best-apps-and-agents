[project]
name = "sentinel-node"
version = "0.1.0"
description = "Evidence-linked claim bundle review, with optional NVIDIA Nemotron inference on Nebius."
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "sqlalchemy>=2.0,<2.1",
  "alembic>=1.15,<2",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.20,<1",
  "defusedxml>=0.7.1,<1",
  "pypdf>=6,<7",
  "httpx>=0.28,<1",
  "python-dotenv>=1,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "playwright>=1.50,<2", "httpx2>=0.22,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"sentinel/api.py" = ["B008"]
